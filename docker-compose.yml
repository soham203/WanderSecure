version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: tourist_safety_postgres
    environment:
      POSTGRES_DB: tourist_safety
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tourist_safety_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tourist_safety_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tourist_safety_network

  # MongoDB
  mongodb:
    image: mongo:7
    container_name: tourist_safety_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: tourist_safety
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - tourist_safety_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tourist_safety_backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: tourist_safety
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key
      AI_SERVICE_URL: http://ai-service:8001
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - tourist_safety_network

  # AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: tourist_safety_ai
    environment:
      PYTHONPATH: /app
    ports:
      - "8001:8001"
    volumes:
      - ./ai-service:/app
    networks:
      - tourist_safety_network

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tourist_safety_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - tourist_safety_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: tourist_safety_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - tourist_safety_network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  tourist_safety_network:
    driver: bridge
